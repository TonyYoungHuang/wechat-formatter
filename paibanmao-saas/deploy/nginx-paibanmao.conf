server {
  listen 80;
  server_name paibanmao.cn www.paibanmao.cn;

  return 301 https://paibanmao.cn$request_uri;
}

server {
  listen 443 ssl http2;
  server_name paibanmao.cn;

  ssl_certificate /etc/letsencrypt/live/paibanmao.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/paibanmao.cn/privkey.pem;

  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
